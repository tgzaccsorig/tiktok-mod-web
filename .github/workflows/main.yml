name: Unpack zip

# Запускается, когда в корень репозитория (ветка main) загружен .zip-файл,
# а также вручную: вкладка Actions → Unpack zip → Run workflow.
on:
  push:
    branches: [main]
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack zip files from repo root
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob

          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "В корне репозитория нет .zip-файлов, делать нечего."
            exit 0
          fi

          for z in "${zips[@]}"; do
            echo "Распаковываю: $z"
            tmp="$(mktemp -d)"
            unzip -q "$z" -d "$tmp"

            # служебный мусор и папка workflow из архива не копируются
            rm -rf "$tmp/__MACOSX"

            # если в архиве одна верхняя папка (tiktok-mod-web/), берём её содержимое
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi
            rm -rf "$src/.github" "$src/.git"

            cp -a "$src"/. .
            git rm -q -f "$z"
          done

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Unpack zip"
            git push
          fi
