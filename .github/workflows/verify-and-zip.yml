name: Verify and package
on:
  push:
    branches: [feature/supabase-social]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  test-build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Create project ZIP
        run: |
          zip -r tiktok-mod-web-supabase.zip . \
            -x ".git/*" ".next/*" "node_modules/*" "*/.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-mod-web-supabase
          path: tiktok-mod-web-supabase.zip
          if-no-files-found: error
          retention-days: 14
